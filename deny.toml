# WyattAu dependency governance — cargo-deny configuration.
# Copy to the repo root. Policies: see engineering-standards README §7.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # proc-macro-error unmaintained — transitive via utoipa 4 (openapi
    # feature). Not a vulnerability; no safe upgrade until utoipa 5.
    "RUSTSEC-2024-0370",
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
